#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
kotlin.js.compiler=ir
#MPP
kotlin.mpp.enableCInteropCommonization=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Sample: build the sample against the PUBLISHED KmpInspector artifact from Maven Central (so the
# Android Studio Run button tests the real release too). Set to false, or delete this line, to
# build the sample against local :library source for fast iteration.
usePublishedInspector=true
