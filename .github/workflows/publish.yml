name: Publish

on:
  release:
    types: [released, prereleased]

permissions:
  contents: read

concurrency:
  group: maven-central-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Release build and publish
    # macOS is mandatory: iosArm64 / iosSimulatorArm64 can only be compiled and linked
    # on a macOS host with Xcode. All five publications (kotlinMultiplatform, android,
    # jvm, iosArm64, iosSimulatorArm64) must ship in ONE Central deployment, so the
    # whole release runs here rather than being split across runners.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          # Fully qualified. A bare tag name is ambiguous to actions/checkout, which resolves a
          # remote BRANCH of that name first -- so a branch called v1.0.0 would shadow the tag.
          # (GITHUB_SHA already points at the tagged commit for release events; pinning the tag
          # ref just makes the intent explicit and closes the shadowing case.)
          ref: refs/tags/${{ github.event.release.tag_name }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle with dependency caching
        uses: gradle/actions/setup-gradle@v4

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Derive the version from the release tag
        id: version
        shell: bash
        env:
          # Through env, not interpolated into the script body, so a crafted tag name
          # cannot inject shell.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not v<major>.<minor>.<patch>[-qualifier]; refusing to publish."
            exit 1
          fi
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Release tag '$TAG' resolves to a -SNAPSHOT version, which would go to the snapshot repository. Refusing."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing io.github.waqas028:kmp-inspector:$VERSION from release tag $TAG"

      - name: Publish to Maven Central
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
      
        run: |
          ./gradlew :library:publishAndReleaseToMavenCentral \
            -PlibraryVersion="$VERSION" \
            --no-configuration-cache \
            --stacktrace
